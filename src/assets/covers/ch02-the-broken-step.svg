  <path d="M-20 524 H120 V464 H240 V404 H300 V500" fill="none" stroke="#17130F" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M300 500 H430 V440 H560 V380 H690 V320 H820 V260 H950 V200 H1232" fill="none" stroke="#17130F" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="120" cy="464" r="18" fill="#FF8A5C" stroke="#17130F" stroke-width="8"/><circle cx="300" cy="500" r="18" fill="#FF8A5C" stroke="#17130F" stroke-width="8"/><circle cx="690" cy="320" r="18" fill="#FF8A5C" stroke="#17130F" stroke-width="8"/><circle cx="950" cy="200" r="18" fill="#FF8A5C" stroke="#17130F" stroke-width="8"/>
  </g>
