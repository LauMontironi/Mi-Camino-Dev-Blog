      <circle cx="3" cy="3" r="2.1" fill="#E8DFCE"/>
    </pattern>
    <clipPath id="frame"><rect x="0" y="0" width="1200" height="630"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
  <rect width="1200" height="630" fill="#FBF6EC"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <path d="M300 404 H420 V344" fill="none" stroke="#17130F" stroke-width="9"
